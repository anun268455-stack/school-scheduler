name: ตรวจสาขา (lint + build) — ไม่ขึ้นเว็บ

# งานนี้ "ตรวจอย่างเดียว" ตั้งใจให้ไม่มีขั้น deploy และไม่มีสิทธิ์เขียน repo
# จะได้ push สาขาที่ยังทำไม่เสร็จขึ้นมาตรวจได้ โดยเว็บที่ครูใช้งานอยู่ไม่เปลี่ยนอะไรเลย
#
# เว็บขึ้นจาก .github/workflows/deploy.yml ซึ่งทำงานเฉพาะตอน push เข้า main เท่านั้น
# ไฟล์นี้จึงกันไม่ให้ main เข้ามาซ้ำ เพราะ deploy.yml ก็ lint + build อยู่แล้ว

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# อ่านได้อย่างเดียว — ต่างจาก deploy.yml ที่ต้องมี contents: write เพื่อเขียน gh-pages
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # build ต้องใช้ VITE_API_URL เป็น secret เหมือน deploy.yml ไม่งั้นค่าจะว่าง
      # ซึ่งไม่เป็นไรสำหรับการตรวจว่าคอมไพล์ผ่าน เพราะไม่มีใครเอาผลนี้ไปใช้
      - name: Build (tsc + vite)
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: ตัวทดสอบของโปรแกรม
        run: bash tests/run.sh
