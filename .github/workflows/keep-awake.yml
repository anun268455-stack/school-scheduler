# ปลุกเซิร์ฟเวอร์ไว้ในเวลาที่คนใช้งาน
#
#   "ตอนนี้เหมือนว่ารอเซิร์ฟเวอร์นานมาก"
#
# ตัวจัดตารางอยู่บนเครื่องฟรีของ Render ซึ่งหลับเมื่อไม่มีใครเรียกใช้สิบห้านาที
# การเปิดหน้าเว็บครั้งแรกของวันจึงต้องรอเครื่องตื่น — เริ่มคอนเทนเนอร์ใหม่ บวก
# ปลุกฐานข้อมูลอีกชั้น ซึ่งคือเวลาที่ครูนั่งรอหน้าจอเปล่า
#
# ที่นี่แค่ยิงคำขอเล็กที่สุดที่มี (/api/state/version ตอบไม่ถึงกิโลไบต์) ทุก
# สิบนาทีในเวลาราชการ เครื่องจึงตื่นอยู่แล้วตอนมีคนเปิดใช้ ไม่ได้แก้ที่ตัว
# เครื่อง แต่ย้ายการรอไปอยู่ในเวลาที่ไม่มีใครรอ
#
# ข้อควรรู้สองข้อ:
#   · GitHub ปิดตารางเวลาแบบนี้เองถ้า repo ไม่มีความเคลื่อนไหวเลยหกสิบวัน
#     (เข้าไปกดเปิดใหม่ได้ที่แท็บ Actions)
#   · เวลาที่ยิงจริงอาจคลาดจากที่ตั้งไว้ไม่กี่นาที เพราะคิวงานของ GitHub —
#     ทุกสิบนาทียังเหลือที่หายใจพอ เพราะเครื่องหลับที่สิบห้านาที
name: ปลุกเซิร์ฟเวอร์ให้ตื่นในเวลาราชการ

on:
  schedule:
    # เวลาที่เขียนคือ UTC ประเทศไทยเร็วกว่าเจ็ดชั่วโมง
    # จันทร์–ศุกร์ 06:00–06:50 น. ไทย (= อาทิตย์–พฤหัส 23:xx UTC)
    - cron: "*/10 23 * * 0-4"
    # จันทร์–ศุกร์ 07:00–18:50 น. ไทย
    - cron: "*/10 0-11 * * 1-5"
  # ปลุกเองได้ด้วย: แท็บ Actions → งานนี้ → Run workflow
  workflow_dispatch:

# ไม่ต้องอ่านหรือเขียนอะไรใน repo เลย
permissions: {}

# ยิงซ้อนกันไม่มีประโยชน์ รอบใหม่มาก็ให้รอบเก่าจบไปก่อน
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ยิงคำขอเบา ๆ ไปที่ตัวจัดตาราง
        env:
          API: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$API" ]; then
            echo "ยังไม่ได้ตั้ง secret ชื่อ VITE_API_URL — ข้ามไป"
            echo "ตั้งได้ที่ Settings → Secrets and variables → Actions"
            exit 0
          fi
          url="${API%/}/api/state/version"
          # ครั้งแรกของวันคือครั้งที่เครื่องต้องตื่น ซึ่งกินเวลาเป็นสิบวินาที
          # จึงให้เวลาต่อครั้งเยอะและลองหลายครั้ง
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$url" -o /tmp/pong; then
              echo "ตื่นแล้ว (รอบที่ $i):"
              head -c 400 /tmp/pong; echo
              exit 0
            fi
            echo "รอบที่ $i ยังไม่ตอบ — รอ 20 วินาทีแล้วลองใหม่"
            sleep 20
          done
          # ไม่ทำให้งานล้ม เพราะงานนี้มีหน้าที่ปลุก ไม่ใช่หน้าที่เฝ้า และการ
          # แจ้งเตือนทุกสิบนาทีตอนเครื่องมีปัญหาจะกลบเรื่องอื่นหมด
          echo "::warning::ปลุกไม่สำเร็จในรอบนี้ — เดี๋ยวรอบหน้าลองอีกครั้ง"
