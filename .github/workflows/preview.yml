name: ลิงก์พรีวิว (ไม่แตะเว็บหลัก)

# เอาโค้ดสาขา term-layer ไปวางไว้ที่ลิงก์แยก เพื่อให้เปิดดูได้ก่อนตัดสินใจ merge
# เว็บหลักที่ครูใช้งานอยู่ไม่เปลี่ยนอะไรเลย
#
#   เว็บหลัก   https://anun268455-stack.github.io/school-scheduler/
#   พรีวิว     https://anun268455-stack.github.io/school-scheduler/preview/
#
# สามอย่างที่ทำให้ขั้นนี้แตะเว็บหลักไม่ได้:
#   1. branches: [term-layer]    — ไม่ทำงานตอน push ขึ้น main (deploy.yml เท่านั้นที่ทำงานตอนนั้น)
#   2. destination_dir: preview  — เขียนลง gh-pages ได้แค่โฟลเดอร์ preview/
#   3. keep_files: true          — ข้ามขั้นลบไฟล์ ของเดิมบน gh-pages จึงถูกแตะไม่ได้เลย
#
# ⚠️ ข้อจำกัดที่ต้องรู้: พรีวิวคุยกับ **เซิร์ฟเวอร์และฐานข้อมูลตัวเดียวกัน** กับเว็บหลัก
# ไม่ใช่ฐานข้อมูลทดลอง อะไรที่กดในพรีวิวแล้วบันทึกสำเร็จ คือบันทึกลงของจริง
# ใช้พรีวิวเพื่อ "ดู" และลองของใหม่อย่างระวัง งานจัดตารางจริงให้ทำบนเว็บหลักต่อไป

on:
  push:
    branches: [term-layer]

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (ให้ตรงกับ deploy.yml)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # ต้องลงท้ายด้วย /preview/ ไม่งั้นไฟล์ js/css จะหาไม่เจอ
          VITE_BASE_URL: /${{ github.event.repository.name }}/preview/
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: วางไว้ที่ /preview/ เท่านั้น
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          destination_dir: preview
          keep_files: true
          commit_message: "พรีวิวสาขา term-layer (ไม่แตะเว็บหลัก)"
